services:
  - type: web
    name: driveportz-backend
    env: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENFORCE_PRODUCTION_READINESS
        value: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: driveportz
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://www.driveportz.com
      - key: CORS_ALLOWED_ORIGINS
        value: ""

      # Customer payments
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Garage settlements: intentionally safe until live Route onboarding is complete.
      - key: SETTLEMENT_MODE
        value: MOCK_TEST_MODE
      - key: SETTLEMENT_PROVIDER
        value: mock
      - key: ALLOW_MOCK_SETTLEMENTS_IN_PRODUCTION
        value: true
      - key: FINANCIAL_JOBS_ENABLED
        value: false

      # Persistent user uploads
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Authentication / OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false

      # AI services used by DrivePortz features
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # Transactional email / password recovery
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
