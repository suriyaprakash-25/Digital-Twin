name: DrivePortz Storage Route Migration

on:
  push:
    branches:
      - production-hardening-2026-09-17
    paths:
      - .github/workflows/storage-route-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    name: Migrate durable uploads to persistent storage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest hardening branch
        uses: actions/checkout@v4
        with:
          ref: production-hardening-2026-09-17
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch durable upload routes with exact markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label, start_offset=0):
              i = text.find(start, start_offset)
              if i < 0:
                  raise SystemExit(f'{label}: start marker not found')
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:i] + replacement.rstrip() + '\n\n' + text[j:]

          # ---------------- AUTH PROFILE / LICENSE ----------------
          auth_path = Path('backend/src/routes/auth.js')
          auth = auth_path.read_text()
          auth = replace_once(auth, "const fs = require('fs');\n", '', 'auth fs import')
          auth = replace_once(
              auth,
              "const { upload, createUploader, removeUploadByUrl } = require('../utils/uploads');",
              "const { upload, createUploader } = require('../utils/uploads');\nconst { persistUploadedFile, deletePersistedFile, removeTemporaryFile } = require('../services/persistentFileStorage');",
              'auth upload imports'
          )

          photo_route = r'''router.post('/me/photo', requireAuth, upload.single('photo'), async (req, res) => {
            if (!req.file) {
              return res.status(400).json({ msg: 'No photo uploaded' });
            }

            const db = getDb();
            const users = db.collection('users');
            let persisted = null;
            let stored = false;

            try {
              const user = await users.findOne({ _id: new ObjectId(String(req.user.id)) });
              if (!user) {
                removeTemporaryFile(req.file);
                return res.status(404).json({ msg: 'User not found' });
              }

              persisted = await persistUploadedFile(req.file, {
                folder: 'driveportz/users/profile',
                resourceType: 'image'
              });

              await users.updateOne(
                { _id: user._id },
                {
                  $set: {
                    photoUrl: persisted.url,
                    photoStorageProvider: persisted.storageProvider,
                    photoStorageKey: persisted.storageKey,
                    photoResourceType: persisted.resourceType || 'image',
                    updatedAt: new Date()
                  }
                }
              );
              stored = true;

              if (user.photoUrl && user.photoUrl !== persisted.url) {
                await deletePersistedFile({
                  url: user.photoUrl,
                  storageProvider: user.photoStorageProvider,
                  storageKey: user.photoStorageKey,
                  resourceType: user.photoResourceType || 'image'
                });
              }

              return res.status(200).json({ msg: 'Photo uploaded', photoUrl: persisted.url });
            } catch (e) {
              if (!stored && persisted) await deletePersistedFile(persisted);
              if (!persisted) removeTemporaryFile(req.file);
              console.error('Profile photo upload failed:', e.message);
              return res.status(500).json({ msg: 'Error uploading photo' });
            }
          });'''

          auth = replace_between(
              auth,
              "router.post('/me/photo'",
              "router.post('/me/license'",
              photo_route,
              'auth photo route'
          )

          license_route = r'''router.post('/me/license', requireAuth, documentUpload.single('license'), async (req, res) => {
            if (!req.file) {
              return res.status(400).json({ msg: 'No license document uploaded' });
            }

            const db = getDb();
            const users = db.collection('users');
            let persisted = null;
            let stored = false;

            try {
              const user = await users.findOne({ _id: new ObjectId(String(req.user.id)) });
              if (!user) {
                removeTemporaryFile(req.file);
                return res.status(404).json({ msg: 'User not found' });
              }

              persisted = await persistUploadedFile(req.file, {
                folder: 'driveportz/users/licenses',
                resourceType: 'auto'
              });

              await users.updateOne(
                { _id: user._id },
                {
                  $set: {
                    licenseDocumentUrl: persisted.url,
                    licenseStorageProvider: persisted.storageProvider,
                    licenseStorageKey: persisted.storageKey,
                    licenseResourceType: persisted.resourceType || 'auto',
                    updatedAt: new Date()
                  }
                }
              );
              stored = true;

              if (user.licenseDocumentUrl && user.licenseDocumentUrl !== persisted.url) {
                await deletePersistedFile({
                  url: user.licenseDocumentUrl,
                  storageProvider: user.licenseStorageProvider,
                  storageKey: user.licenseStorageKey,
                  resourceType: user.licenseResourceType || 'image'
                });
              }

              return res.status(200).json({ msg: 'License uploaded', licenseDocumentUrl: persisted.url });
            } catch (e) {
              if (!stored && persisted) await deletePersistedFile(persisted);
              if (!persisted) removeTemporaryFile(req.file);
              console.error('License upload failed:', e.message);
              return res.status(500).json({ msg: 'Error uploading license' });
            }
          });'''

          auth = replace_between(
              auth,
              "router.post('/me/license'",
              "router.post('/google'",
              license_route,
              'auth license route'
          )
          auth_path.write_text(auth)

          # ---------------- GARAGE PROFILE / GALLERY ----------------
          garages_path = Path('backend/src/routes/garages.js')
          garages = garages_path.read_text()
          garages = replace_once(garages, "const fs = require('fs');\n", '', 'garages fs import')
          garages = replace_once(
              garages,
              "const { upload, createUploader, removeUploadByUrl } = require('../utils/uploads');",
              "const { createUploader } = require('../utils/uploads');\nconst { persistUploadedFile, persistUploadedFiles, deletePersistedFile, removeTemporaryFile } = require('../services/persistentFileStorage');",
              'garages upload imports'
          )

          gallery_route = r'''router.post('/gallery', requireAuth, requireRole('GARAGE'), galleryUploader.array('photos', 10), async (req, res) => {
            const files = Array.isArray(req.files) ? req.files : [];
            if (files.length === 0) {
              return res.status(400).json({ msg: 'No photos provided' });
            }

            const db = getDb();
            const garages = db.collection('garages');
            let persisted = [];
            let stored = false;

            try {
              const garage = await garages.findOne({ ownerUserId: String(req.user.id) });
              if (!garage) {
                files.forEach(removeTemporaryFile);
                return res.status(404).json({ msg: 'Garage profile not found' });
              }

              persisted = await persistUploadedFiles(files, {
                folder: 'driveportz/garages/gallery',
                resourceType: 'image'
              });
              const newPhotos = persisted.map((asset) => asset.url);

              const result = await garages.findOneAndUpdate(
                { _id: garage._id },
                { $push: { galleryPhotos: { $each: newPhotos } }, $set: { updatedAt: new Date() } },
                { returnDocument: 'after' }
              );
              stored = true;

              return res.status(200).json({
                msg: 'Photos uploaded successfully',
                photoUrls: newPhotos,
                galleryPhotos: result?.galleryPhotos || [...(garage.galleryPhotos || []), ...newPhotos]
              });
            } catch (err) {
              if (!stored && persisted.length > 0) {
                await Promise.allSettled(persisted.map((asset) => deletePersistedFile(asset)));
              } else if (persisted.length === 0) {
                files.forEach(removeTemporaryFile);
              }
              console.error('Error uploading gallery photos:', err.message);
              return res.status(500).json({ msg: 'Server error uploading photos' });
            }
          });'''

          garages = replace_between(
              garages,
              "router.post('/gallery'",
              "router.post('/photo'",
              gallery_route,
              'primary garage gallery route'
          )

          photo_route = r'''router.post('/photo', requireAuth, requireRole('GARAGE'), galleryUploader.single('photo'), async (req, res) => {
            if (!req.file) {
              return res.status(400).json({ msg: 'No photo provided' });
            }

            const db = getDb();
            const garages = db.collection('garages');
            let persisted = null;
            let stored = false;

            try {
              const garage = await garages.findOne({ ownerUserId: String(req.user.id) });
              if (!garage) {
                removeTemporaryFile(req.file);
                return res.status(404).json({ msg: 'Garage profile not found' });
              }

              persisted = await persistUploadedFile(req.file, {
                folder: 'driveportz/garages/profile',
                resourceType: 'image'
              });

              await garages.updateOne(
                { _id: garage._id },
                {
                  $set: {
                    photoUrl: persisted.url,
                    photoStorageProvider: persisted.storageProvider,
                    photoStorageKey: persisted.storageKey,
                    photoResourceType: persisted.resourceType || 'image',
                    updatedAt: new Date()
                  }
                }
              );
              stored = true;

              if (garage.photoUrl && garage.photoUrl !== persisted.url) {
                await deletePersistedFile({
                  url: garage.photoUrl,
                  storageProvider: garage.photoStorageProvider,
                  storageKey: garage.photoStorageKey,
                  resourceType: garage.photoResourceType || 'image'
                });
              }

              return res.status(200).json({ msg: 'Photo uploaded successfully', photoUrl: persisted.url });
            } catch (err) {
              if (!stored && persisted) await deletePersistedFile(persisted);
              if (!persisted) removeTemporaryFile(req.file);
              console.error('Error uploading garage photo:', err.message);
              return res.status(500).json({ msg: 'Server error uploading photo' });
            }
          });'''

          garages = replace_between(
              garages,
              "router.post('/photo'",
              "router.patch('/me/capacity'",
              photo_route,
              'primary garage photo route'
          )

          # Remove the later duplicate POST /photo and POST /gallery handlers.
          duplicate_photo_start = "// POST /api/garages/photo — garage owner uploads a profile photo"
          duplicate_gallery_start = "// POST /api/garages/gallery — garage owner uploads gallery photos"
          delete_gallery_start = "// DELETE /api/garages/gallery — remove photo from garage gallery"
          garages = replace_between(
              garages,
              duplicate_photo_start,
              duplicate_gallery_start,
              '',
              'duplicate garage photo route'
          )
          garages = replace_between(
              garages,
              duplicate_gallery_start,
              delete_gallery_start,
              '',
              'duplicate garage gallery route'
          )
          garages = replace_once(
              garages,
              '    removeUploadByUrl(photoUrl);',
              '    await deletePersistedFile({ url: photoUrl });',
              'garage gallery delete persistence'
          )
          garages_path.write_text(garages)

          # ---------------- DISPUTE EVIDENCE ----------------
          disputes_path = Path('backend/src/routes/disputes.js')
          disputes = disputes_path.read_text()
          import_anchor = "const { logFinancialAudit } = require('../services/auditService');"
          disputes = replace_once(
              disputes,
              import_anchor,
              import_anchor + "\nconst { persistUploadedFile, removeTemporaryFile } = require('../services/persistentFileStorage');",
              'dispute persistent storage import'
          )

          evidence_function = r'''// Process evidence upload
          async function processEvidenceUpload(file) {
            if (!file) return null;

            const persisted = await persistUploadedFile(file, {
              folder: 'driveportz/disputes',
              resourceType: 'auto'
            });

            return {
              url: persisted.url,
              storageProvider: persisted.storageProvider,
              storageKey: persisted.storageKey,
              resourceType: persisted.resourceType || 'auto',
              originalName: file.originalname,
              mimeType: file.mimetype,
              uploadedAt: new Date()
            };
          }'''

          disputes = replace_between(
              disputes,
              '// Process evidence upload',
              '// ──────────────────────── USER DISPUTE ENDPOINTS',
              evidence_function,
              'dispute evidence persistence'
          )
          disputes = replace_once(
              disputes,
              "  if (!paymentId || !description) {\n    return res.status(400).json({ success: false, message: 'Payment ID and description are required' });\n  }",
              "  if (!paymentId || !description) {\n    removeTemporaryFile(req.file);\n    return res.status(400).json({ success: false, message: 'Payment ID and description are required' });\n  }",
              'dispute invalid request cleanup'
          )
          disputes_path.write_text(disputes)
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend verification suites
        working-directory: backend
        env:
          NODE_ENV: development
          MONGO_URI: mongodb://127.0.0.1:27017/driveportz_storage_migration
          MONGO_DB_NAME: driveportz_storage_migration
          JWT_SECRET_KEY: storage-migration-ci-only-secret-key-min-32-chars
          EMAIL_PROVIDER: mock
          SETTLEMENT_MODE: MOCK_TEST_MODE
          SETTLEMENT_PROVIDER: mock
        run: |
          docker run -d --name driveportz-mongo -p 27017:27017 mongo:7
          for i in {1..30}; do
            if node -e "const { MongoClient }=require('mongodb'); const c=new MongoClient('mongodb://127.0.0.1:27017'); c.connect().then(()=>c.db('admin').command({ping:1})).then(()=>c.close()).then(()=>process.exit(0)).catch(()=>process.exit(1))"; then break; fi
            sleep 2
          done
          npm test

      - name: Commit route migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/routes/auth.js backend/src/routes/garages.js backend/src/routes/disputes.js
          if git diff --cached --quiet; then
            echo "No storage route changes were required."
            exit 0
          fi
          git commit -m "fix: persist durable uploads through Cloudinary storage"
          git push origin HEAD:production-hardening-2026-09-17
