name: DrivePortz Auth Role Hardening

on:
  push:
    branches:
      - production-hardening-2026-09-17
    paths:
      - .github/workflows/auth-role-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening-2026-09-17
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply auth hardening
        run: node scripts/harden-public-registration-roles.cjs
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run hardening regression tests
        working-directory: backend
        env:
          NODE_ENV: development
          JWT_SECRET_KEY: auth-role-hardening-ci-secret-key-min-32-chars
        run: npm run test:hardening
      - name: Commit verified auth hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/routes/auth.js backend/test_production_hardening_suite.js
          git diff --cached --quiet && exit 0
          git commit -m "security: block privileged roles in public registration"
          git push origin HEAD:production-hardening-2026-09-17
