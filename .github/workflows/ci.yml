name: DrivePortz CI

on:
  push:
    branches:
      - main
      - production-hardening-2026-09-17
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-verification:
    name: Backend verification
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB_NAME: driveportz_ci
      JWT_SECRET_KEY: ci-only-driveportz-secret-key-2026-min-32-chars
      FRONTEND_URL: http://localhost:5173
      EMAIL_PROVIDER: mock
      SETTLEMENT_MODE: MOCK_TEST_MODE
      SETTLEMENT_PROVIDER: mock
      FINANCIAL_JOBS_ENABLED: false

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Supply-chain guard (injected loader / hidden build code)
        working-directory: .
        run: node scripts/supply-chain-guard.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Run backend verification suites
        run: npm test

  frontend-verification:
    name: Frontend security, lint and production build
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: https://ci-api.invalid
      VITE_GOOGLE_CLIENT_ID: ci-driveportz-client.apps.googleusercontent.com

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Supply-chain guard (injected loader / hidden build code)
        working-directory: .
        run: node scripts/supply-chain-guard.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint frontend correctness rules
        run: npm run lint -- --max-warnings=0

      - name: Frontend unit tests
        run: npm test

      - name: Build frontend using Vercel production contract
        run: npm run build:production

  responsive-browser-smoke:
    name: Responsive browser smoke
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: https://ci-api.invalid
      VITE_GOOGLE_CLIENT_ID: ci-driveportz-client.apps.googleusercontent.com

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Supply-chain guard (injected loader / hidden build code)
        working-directory: .
        run: node scripts/supply-chain-guard.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright test runner for CI
        run: npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.55.0

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium msedge

      - name: Build frontend using Vercel production contract
        run: npm run build:production

      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/driveportz-vite-preview.log 2>&1 &
          echo $! > /tmp/driveportz-vite-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/driveportz-vite-preview.log
          exit 1

      - name: Run responsive browser smoke suite
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/pilot-responsive.spec.js --reporter=line

  browser-e2e:
    name: Browser end-to-end journey
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB_NAME: driveportz_e2e
      # Must match the values playwright.e2e.config.js passes to `vite build` when it builds itself.
      VITE_API_URL: http://127.0.0.1:5099
      VITE_GOOGLE_CLIENT_ID: e2e-client.apps.googleusercontent.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Supply-chain guard (injected loader / hidden build code)
        run: node scripts/supply-chain-guard.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright test runner for CI
        working-directory: frontend
        run: npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.55.0

      - name: Install Chromium runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Seed throwaway E2E database
        working-directory: backend
        env:
          NODE_ENV: development
        run: node scripts/e2e-seed.mjs

      - name: Build frontend against the local E2E API
        working-directory: frontend
        run: npm run build

      - name: Run browser end-to-end suite
        working-directory: frontend
        env:
          E2E_PREBUILT: '1'
          E2E_SKIP_SEED: '1'
        run: npx playwright test --config playwright.e2e.config.js --project e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            frontend/playwright-report/e2e
            frontend/test-results/e2e
          retention-days: 14
          if-no-files-found: ignore
